spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT_INTERNAL}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

keycloak.server-url=http://Keycloak:8080
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://Keycloak:8080/realms/${keycloak.realm}
keycloak.token-url=${keycloak.server-url}/realms/${keycloak.realm}/protocol/openid-connect

services.user-service.url=${USER_SERVICE_URL}
services.user-service.name=${USER_SERVICE_NAME}
